# custom_rtm_config.yaml
# This file contains the custom configuration for RTM generation.
# Modify the values below to customize the RTM output.

rtm_generation:
  enabled: true
  output_directory: "./output"
  file_name: "custom_rtm_output.docx"
  template_file: "./templates/rtm_template.docx"

filters:
  include_sections:
    - "Requirements"
    - "Design"
    - "Testing"
  exclude_sections:
    - "Deprecated"
    - "Draft"

formatting:
  header_style:
    font: "Arial"
    size: 12
    bold: true
  body_style:
    font: "Times New Roman"
    size: 11
    italic: false

metadata:
  author: "Your Name"
  version: "1.0"
  date: "2023-10-01"

logging:
  level: "INFO"
  log_file: "./logs/rtm_generation.log"