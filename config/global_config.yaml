project:
  name: DOCX RTM Automation
  version: 1.0.0

paths:
  python: c:\Users\gbonthuy\Downloads\DOCX_RTM_Automation_v1.0\.venv\Scripts\python.exe
  git_bash: C:\Program Files\Git\bin\bash.exe
  pandoc: pandoc
  office_template: C:\Users\gbonthuy\Documents\Custom Office Templates\GPT Outline.dotx
  input_dir: input
  output_dir: output
  logs_dir: logs
  config_dir: config

repository_settings:
  main_repository_path: "." # Relative to project root or absolute
  sub_repositories: # List of paths to sub-repositories or submodules
    # - ../another-project-submodule
    # - external/component-library
  default_branch: main

environment:
  development: MS VS Code, Git BASH and PowerShell
  requirements:
  - Python 3.x
  - PyYAML
  - pandoc

api_keys:
  openai: "your-openai-api-key"
  github: '' # Personal Access Token for accessing private repos or increasing rate limits
  copilot: "your-copilot-api-key"
  google_gemini: "your-google-gemini-api-key"

ai_services:
  openai:
    default_model: "gpt-4-turbo-preview" # Specify default model for tasks
    completion_model: "gpt-3.5-turbo-instruct"
    embedding_model: "text-embedding-ada-002"
    max_tokens: 4096
    temperature: 0.7

deliverables_matrix:
  data_tables: 15
  description: YAML data tables for design/process deliverables

pandoc:
  lua_filter: config/extend_headings.lua
  toc_depth: 6
  number_sections: true
