[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rtm-automation"
version = "1.0.0"
description = "RTM (Requirements Traceability Matrix) Automation System"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "python-docx>=0.8.11",
    "openpyxl>=3.0.10",
    "pandas>=1.5.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "flask>=2.3.0",
    "requests>=2.28.0",
    "pathlib2>=2.3.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]
web = [
    "flask-cors>=4.0.0",
    "gunicorn>=20.1.0",
]
parsing = [
    "lxml>=4.9.0",
    "beautifulsoup4>=4.11.0",
    "markdown>=3.4.0",
]

[project.urls]
"Homepage" = "https://github.com/rtm-automation/rtm-system"
"Bug Tracker" = "https://github.com/rtm-automation/rtm-system/issues"
"Documentation" = "https://rtm-automation.readthedocs.io/"

[project.scripts]
rtm-analyze = "src.analyzers.json_file_analyzer_safe:main"
rtm-status = "main_organized:main"
rtm-dashboard = "launch_dashboard:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["rtm*", "analyzers*", "dashboard*", "parsers*", "utils*", "integrations*"]

[tool.ruff]
target-version = "py38"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",
    "B008",
    "C901",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"test_*.py" = ["S101"]

[tool.black]
target-version = ["py38"]
line-length = 88
skip-string-normalization = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "docx.*",
    "openpyxl.*",
    "pandas.*",
    "flask.*",
]
ignore_missing_imports = true
