name: ADR_OCD Bridge Validation

on:
  pull_request:
    paths:
      - 'glossary/GLOSSARY.yaml'
      - 'schemas/glossary.schema.json'
      - 'schemas/adr_ocd_bridge_manifest.schema.json'
      - 'federation/ADR_OCD/**'
      - 'configs/qps_triage_parser_config.yaml'
      - 'parser/engine.py'
      - 'parser/qps_triage_bridge.py'
      - 'src/dashboard/canonical_dashboard.py'
      - 'src/dashboard/qps_triage_dashboard.py'
      - 'scripts/validate_adr_ocd_bridge.py'
      - 'scripts/export_qps_triage_traceability.py'
      - 'tests/test_adr_ocd_bridge_validation.py'
      - 'tests/test_qps_triage_bridge.py'
      - '.github/workflows/adr_ocd_bridge_validation.yml'
  push:
    branches:
      - feature/ADR_OCD-qps-procurement-bridge
      - feature/ADR_OCD-qps-triage-applicability
      - feature/qps-triage-parser-export-waves
      - feature/qps-triage-engine-integration
      - feature/qps-triage-export-persistence
    paths:
      - 'glossary/GLOSSARY.yaml'
      - 'schemas/glossary.schema.json'
      - 'schemas/adr_ocd_bridge_manifest.schema.json'
      - 'federation/ADR_OCD/**'
      - 'configs/qps_triage_parser_config.yaml'
      - 'parser/engine.py'
      - 'parser/qps_triage_bridge.py'
      - 'src/dashboard/canonical_dashboard.py'
      - 'src/dashboard/qps_triage_dashboard.py'
      - 'scripts/validate_adr_ocd_bridge.py'
      - 'scripts/export_qps_triage_traceability.py'
      - 'tests/test_adr_ocd_bridge_validation.py'
      - 'tests/test_qps_triage_bridge.py'
      - '.github/workflows/adr_ocd_bridge_validation.yml'

jobs:
  validate-adr-ocd-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lightweight validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml pytest pytest-cov pandas python-docx

      - name: Validate bridge artifacts
        run: python scripts/validate_adr_ocd_bridge.py

      - name: Run bridge tests
        run: pytest -o addopts='' tests/test_adr_ocd_bridge_validation.py tests/test_qps_triage_bridge.py
