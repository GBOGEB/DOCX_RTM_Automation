name: ADR_OCD Bridge Validation

on:
  pull_request:
    paths:
      - 'glossary/GLOSSARY.yaml'
      - 'schemas/glossary.schema.json'
      - 'schemas/adr_ocd_bridge_manifest.schema.json'
      - 'federation/ADR_OCD/**'
      - 'configs/qps_triage_parser_config.yaml'
      - 'parser/engine.py'
      - 'parser/qps_triage_bridge.py'
      - 'src/dashboard/canonical_dashboard.py'
      - 'src/dashboard/qps_triage_dashboard.py'
      - 'scripts/validate_adr_ocd_bridge.py'
      - 'scripts/export_qps_triage_traceability.py'
      - 'scripts/run_qps_triage_pipeline.py'
      - 'scripts/verify_qps_triage_receipt.py'
      - 'tests/fixtures/qps_triage_pipeline_input.json'
      - 'tests/test_adr_ocd_bridge_validation.py'
      - 'tests/test_qps_triage_bridge.py'
      - 'tests/test_qps_triage_pipeline.py'
      - '.github/workflows/adr_ocd_bridge_validation.yml'
  push:
    branches:
      - feature/ADR_OCD-qps-procurement-bridge
      - feature/ADR_OCD-qps-triage-applicability
      - feature/qps-triage-parser-export-waves
      - feature/qps-triage-engine-integration
      - feature/qps-triage-export-persistence
      - feature/qps-triage-wave8-evidence-governance
    paths:
      - 'glossary/GLOSSARY.yaml'
      - 'schemas/glossary.schema.json'
      - 'schemas/adr_ocd_bridge_manifest.schema.json'
      - 'federation/ADR_OCD/**'
      - 'configs/qps_triage_parser_config.yaml'
      - 'parser/engine.py'
      - 'parser/qps_triage_bridge.py'
      - 'src/dashboard/canonical_dashboard.py'
      - 'src/dashboard/qps_triage_dashboard.py'
      - 'scripts/validate_adr_ocd_bridge.py'
      - 'scripts/export_qps_triage_traceability.py'
      - 'scripts/run_qps_triage_pipeline.py'
      - 'scripts/verify_qps_triage_receipt.py'
      - 'tests/fixtures/qps_triage_pipeline_input.json'
      - 'tests/test_adr_ocd_bridge_validation.py'
      - 'tests/test_qps_triage_bridge.py'
      - 'tests/test_qps_triage_pipeline.py'
      - '.github/workflows/adr_ocd_bridge_validation.yml'

jobs:
  validate-adr-ocd-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lightweight validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml pytest pytest-cov pandas python-docx

      - name: Validate bridge artifacts
        run: python scripts/validate_adr_ocd_bridge.py

      - name: Run bridge and governed pipeline tests
        run: pytest -o addopts='' tests/test_adr_ocd_bridge_validation.py tests/test_qps_triage_bridge.py tests/test_qps_triage_pipeline.py

      - name: Run Wave 8 governed pipeline fixture
        env:
          QPS_EVIDENCE_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          rm -rf .artifacts/qps-triage-wave8
          python scripts/run_qps_triage_pipeline.py \
            --input-analysis tests/fixtures/qps_triage_pipeline_input.json \
            --output-dir .artifacts/qps-triage-wave8

      - name: Verify Wave 8 hashes and manifest parity
        run: python scripts/verify_qps_triage_receipt.py .artifacts/qps-triage-wave8

      - name: Upload Wave 8 governed evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: qps-triage-wave8-${{ github.event.pull_request.head.sha || github.sha }}
          path: .artifacts/qps-triage-wave8/
          if-no-files-found: error
          retention-days: 14
