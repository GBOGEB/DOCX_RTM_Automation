name: ADR_OCD Bridge Validation

on:
  pull_request:
    paths:
      - 'glossary/GLOSSARY.yaml'
      - 'schemas/**'
      - 'federation/ADR_OCD/**'
      - 'configs/qps_triage_parser_config.yaml'
      - 'parser/**'
      - 'src/dashboard/canonical_dashboard.py'
      - 'src/dashboard/qps_triage_dashboard.py'
      - 'src/dashboard/qps_receipt_consumer.py'
      - 'scripts/validate_adr_ocd_bridge.py'
      - 'scripts/export_qps_triage_traceability.py'
      - 'scripts/run_qps_triage_pipeline.py'
      - 'scripts/verify_qps_triage_receipt.py'
      - 'scripts/create_qps_triage_ci_registry_receipt.py'
      - 'scripts/build_qps_release_baseline.py'
      - 'tests/fixtures/qps_triage_pipeline_input.json'
      - 'tests/test_adr_ocd_bridge_validation.py'
      - 'tests/test_qps_triage_bridge.py'
      - 'tests/test_qps_triage_pipeline.py'
      - 'tests/test_qps_receipt_consumer.py'
      - 'tests/test_qps_release_baseline.py'
      - '.github/workflows/adr_ocd_bridge_validation.yml'
  push:
    branches:
      - feature/ADR_OCD-qps-procurement-bridge
      - feature/ADR_OCD-qps-triage-applicability
      - feature/qps-triage-parser-export-waves
      - feature/qps-triage-engine-integration
      - feature/qps-triage-export-persistence
      - feature/qps-triage-wave8-evidence-governance
      - feature/qps-triage-wave9-ci-registry-receipt
      - feature/qps-triage-wave10-receipt-consumption
      - feature/qps-triage-wave11-release-baseline-gate
    paths:
      - 'glossary/GLOSSARY.yaml'
      - 'schemas/**'
      - 'federation/ADR_OCD/**'
      - 'configs/qps_triage_parser_config.yaml'
      - 'parser/**'
      - 'src/dashboard/canonical_dashboard.py'
      - 'src/dashboard/qps_triage_dashboard.py'
      - 'src/dashboard/qps_receipt_consumer.py'
      - 'scripts/validate_adr_ocd_bridge.py'
      - 'scripts/export_qps_triage_traceability.py'
      - 'scripts/run_qps_triage_pipeline.py'
      - 'scripts/verify_qps_triage_receipt.py'
      - 'scripts/create_qps_triage_ci_registry_receipt.py'
      - 'scripts/build_qps_release_baseline.py'
      - 'tests/fixtures/qps_triage_pipeline_input.json'
      - 'tests/test_adr_ocd_bridge_validation.py'
      - 'tests/test_qps_triage_bridge.py'
      - 'tests/test_qps_triage_pipeline.py'
      - 'tests/test_qps_receipt_consumer.py'
      - 'tests/test_qps_release_baseline.py'
      - '.github/workflows/adr_ocd_bridge_validation.yml'

jobs:
  validate-adr-ocd-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lightweight validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml pytest pytest-cov pandas python-docx

      - name: Validate bridge artifacts
        run: python scripts/validate_adr_ocd_bridge.py

      - name: Run bridge and governed pipeline tests
        run: pytest -o addopts='' tests/test_adr_ocd_bridge_validation.py tests/test_qps_triage_bridge.py tests/test_qps_triage_pipeline.py tests/test_qps_receipt_consumer.py tests/test_qps_release_baseline.py

      - name: Run Wave 8 governed pipeline fixture
        env:
          QPS_EVIDENCE_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          rm -rf .artifacts/qps-triage-wave8 .artifacts/qps-triage-wave9 .artifacts/qps-triage-wave10 .artifacts/qps-triage-wave11
          python scripts/run_qps_triage_pipeline.py \
            --input-analysis tests/fixtures/qps_triage_pipeline_input.json \
            --output-dir .artifacts/qps-triage-wave8

      - name: Verify Wave 8 hashes and manifest parity
        run: python scripts/verify_qps_triage_receipt.py .artifacts/qps-triage-wave8

      - name: Upload Wave 8 governed evidence bundle
        id: wave8_bundle
        uses: actions/upload-artifact@v4
        with:
          name: qps-triage-wave8-${{ github.event.pull_request.head.sha || github.sha }}
          path: .artifacts/qps-triage-wave8/
          if-no-files-found: error
          retention-days: 14

      - name: Create Wave 9 CI registry receipt
        run: |
          mkdir -p .artifacts/qps-triage-wave9
          python scripts/create_qps_triage_ci_registry_receipt.py \
            .artifacts/qps-triage-wave8 \
            --artifact-id '${{ steps.wave8_bundle.outputs.artifact-id }}' \
            --artifact-url '${{ steps.wave8_bundle.outputs.artifact-url }}' \
            --artifact-digest '${{ steps.wave8_bundle.outputs.artifact-digest }}' \
            --artifact-name 'qps-triage-wave8-${{ github.event.pull_request.head.sha || github.sha }}' \
            --output .artifacts/qps-triage-wave9/qps_triage_ci_registry_receipt.json

      - name: Consume Wave 9 receipt into release evidence
        run: |
          mkdir -p .artifacts/qps-triage-wave10
          python src/dashboard/qps_receipt_consumer.py \
            .artifacts/qps-triage-wave9/qps_triage_ci_registry_receipt.json \
            --expected-git-sha '${{ github.event.pull_request.head.sha || github.sha }}' \
            --output .artifacts/qps-triage-wave10/qps_release_baseline_evidence.json \
            --require-accept
          python src/dashboard/canonical_dashboard.py --json \
            --qps-triage-dashboard .artifacts/qps-triage-wave8/qps_triage_dashboard.json \
            --qps-registry-receipt .artifacts/qps-triage-wave9/qps_triage_ci_registry_receipt.json \
            --expected-git-sha '${{ github.event.pull_request.head.sha || github.sha }}' \
            > .artifacts/qps-triage-wave10/canonical_dashboard.json

      - name: Promote Wave 11 procurement release baseline
        run: |
          mkdir -p .artifacts/qps-triage-wave11
          python scripts/build_qps_release_baseline.py \
            --evidence .artifacts/qps-triage-wave10/qps_release_baseline_evidence.json \
            --stage final_corrigendum \
            --expected-git-sha '${{ github.event.pull_request.head.sha || github.sha }}' \
            --output .artifacts/qps-triage-wave11/qps_release_baseline_manifest.json \
            --require-promote

      - name: Upload Wave 9 registry receipt
        uses: actions/upload-artifact@v4
        with:
          name: qps-triage-wave9-registry-${{ github.event.pull_request.head.sha || github.sha }}
          path: .artifacts/qps-triage-wave9/qps_triage_ci_registry_receipt.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload Wave 10 consumption decision
        uses: actions/upload-artifact@v4
        with:
          name: qps-triage-wave10-consumption-${{ github.event.pull_request.head.sha || github.sha }}
          path: .artifacts/qps-triage-wave10/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Wave 11 release baseline decision
        uses: actions/upload-artifact@v4
        with:
          name: qps-triage-wave11-release-${{ github.event.pull_request.head.sha || github.sha }}
          path: .artifacts/qps-triage-wave11/
          if-no-files-found: error
          retention-days: 14
