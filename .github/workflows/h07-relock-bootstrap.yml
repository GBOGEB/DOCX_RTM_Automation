name: H07 relock bootstrap (temporary)

# Temporary, branch-only: re-locks after the H07 security bumps on a clean
# runner and commits the result to this branch. Deleted before review.
on:
  push:
    branches: [fix/h07-used-manifest-vulns-20261027]

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ !contains(github.event.head_commit.message, '[relock-bootstrap-output]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Re-lock
        shell: bash
        run: |
          set -uo pipefail
          run() {
            local label="$1"; shift
            if ! "$@" > "$RUNNER_TEMP/out.log" 2>&1; then
              msg=$(tail -c 3500 "$RUNNER_TEMP/out.log" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              echo "::error title=${label}::${msg}"
              exit 1
            fi
          }
          run uv-install python -m pip install uv==0.9.0
          # Find the oldest pdfplumber whose pdfminer.six pin is >= 20251230 (GHSA-f83h-ghpp-7wcc, GHSA-wf5f-4jwr-ppcp).
          sed '/^pdfplumber==/d' requirements/requirements.txt > "$RUNNER_TEMP/probe.in"
          printf 'pdfplumber>=0.11.5\npdfminer.six>=20251230\n' >> "$RUNNER_TEMP/probe.in"
          run uv-probe uv pip compile "$RUNNER_TEMP/probe.in" --universal --python-version 3.12 \
            --resolution lowest-direct --no-header -o "$RUNNER_TEMP/probe.lock"
          ver=$(grep -E '^pdfplumber==' "$RUNNER_TEMP/probe.lock" | cut -d= -f3)
          miner=$(grep -E '^pdfminer-six==' "$RUNNER_TEMP/probe.lock" | cut -d= -f3)
          echo "::notice title=pdfplumber::pdfplumber==$ver (pdfminer.six==$miner)"
          test -n "$ver" || { echo "::error title=probe::no pdfplumber version found"; exit 1; }
          sed -i -E "s/^pdfplumber==[^ ]+/pdfplumber==$ver/" requirements/requirements.txt
          # Keep every other pin: seed with the committed lock minus hashes (same as dependency-lock.yml).
          sed -E '/^[[:space:]]*--hash=/d; s/[[:space:]]+\\$//' requirements/requirements.lock > "$RUNNER_TEMP/seed.lock"
          run uv-compile uv pip compile requirements/requirements.txt --universal --python-version 3.12 \
            --generate-hashes --no-header -o "$RUNNER_TEMP/seed.lock"
          cp "$RUNNER_TEMP/seed.lock" requirements/requirements.lock
          cd orchestration_ts
          run npm-lock npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit --package-lock-only --json > "$RUNNER_TEMP/audit.json" || true
          node -e 'const a=require(process.argv[1]);const v=a.vulnerabilities||{};const s=Object.entries(v).map(([k,x])=>k+":"+x.severity).join(" ");console.log("::notice title=npm-audit-after::"+JSON.stringify(a.metadata.vulnerabilities)+" "+s)' "$RUNNER_TEMP/audit.json"
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements/requirements.txt requirements/requirements.lock orchestration_ts/package-lock.json
          run git-commit git commit -m "build(deps): re-lock after H07 security bumps on clean runner [relock-bootstrap-output]"
          run git-push git push
