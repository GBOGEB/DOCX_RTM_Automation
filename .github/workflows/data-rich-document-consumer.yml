name: Data-rich JSON DOCX consumer

on:
  pull_request:
    paths:
      - 'federation/DATA_RICH_DOCUMENT/**'
      - 'scripts/build_data_rich_reference_docx.py'
      - 'scripts/fix_requirement_page_splits.py'
      - 'scripts/measure_visual_style_diff.py'
      - 'scripts/resolve_visual_style_fonts.py'
      - 'scripts/build_visual_style_specimen.py'
      - 'src/bridges/data_rich_document_consumer.py'
      - 'tests/test_data_rich_document_consumer.py'
      - '.github/workflows/data-rich-document-consumer.yml'
  push:
    branches:
      - main
    paths:
      - 'federation/DATA_RICH_DOCUMENT/**'
      - 'scripts/build_data_rich_reference_docx.py'
      - 'scripts/fix_requirement_page_splits.py'
      - 'scripts/measure_visual_style_diff.py'
      - 'scripts/resolve_visual_style_fonts.py'
      - 'scripts/build_visual_style_specimen.py'
      - 'src/bridges/data_rich_document_consumer.py'
      - 'tests/test_data_rich_document_consumer.py'
      - '.github/workflows/data-rich-document-consumer.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact consumer commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout proven producer adapter
        uses: actions/checkout@v4
        with:
          repository: GBOGEB/document-organization-system
          ref: e181903236e70b7b798b56fd59fc8948cd9885c0
          path: producer

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install DOCX render dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-docx pillow
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice-writer poppler-utils fontconfig

      - name: Run consumer fail-closed tests
        run: >-
          python -m unittest
          tests.test_data_rich_document_consumer

      - name: Build projection from proven producer
        run: |
          rm -rf projection output render render_pre style_render
          mkdir -p projection output render render_pre style_render
          python producer/adapters/docx_rtm/build_projection.py \
            producer/contracts/data_rich_document/examples/adr-001.json \
            --output-dir projection \
            --source-repo GBOGEB/document-organization-system \
            --source-ref e181903236e70b7b798b56fd59fc8948cd9885c0

      - name: Resolve render-host fonts
        run: |
          python scripts/resolve_visual_style_fonts.py \
            --source-style federation/DATA_RICH_DOCUMENT/visual_style.json \
            --output output/visual_style.resolved.json \
            --receipt output/visual_font_resolution.json
          cat output/visual_font_resolution.json

      - name: Build governed reference DOCX
        run: >-
          python scripts/build_data_rich_reference_docx.py
          --output config/reference.docx
          --style-config output/visual_style.resolved.json

      - name: Build full visual-style specimen
        run: |
          python scripts/build_visual_style_specimen.py \
            --style-config output/visual_style.resolved.json \
            --output output/visual_style_specimen.docx \
            --receipt output/visual_style_specimen_coverage.json
          libreoffice --headless --convert-to pdf --outdir style_render output/visual_style_specimen.docx
          test -s style_render/visual_style_specimen.pdf
          pdftoppm -png -r 144 \
            style_render/visual_style_specimen.pdf \
            style_render/visual_style_specimen-page
          test -n "$(find style_render -name 'visual_style_specimen-page-*.png' -print -quit)"
          cat output/visual_style_specimen_coverage.json

      - name: Render DOCX and emit return receipt
        run: |
          python src/bridges/data_rich_document_consumer.py \
            --markdown projection/ADR-001.projection.md \
            --manifest projection/ADR-001.outward_document_manifest.json \
            --reference-doc config/reference.docx \
            --output-docx output/ADR-001.docx \
            --receipt output/ADR-001.render_receipt.json \
            --style-config output/visual_style.resolved.json \
            --expected-source-ref e181903236e70b7b798b56fd59fc8948cd9885c0

      - name: Assert structural receipt gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path("output/ADR-001.render_receipt.json").read_text())
          for key in (
              "render_status",
              "heading_style_check",
              "template_numbering_check",
              "duplicate_numbering_check",
              "requirement_pagination_check",
              "visual_style_check",
          ):
              assert receipt[key] == "PASS", (key, receipt[key])
          assert receipt["authority"]["authority_transfer"] is False
          assert receipt["authority"]["rendered_output_authoritative"] is False
          font_receipt = json.loads(Path("output/visual_font_resolution.json").read_text())
          coverage = json.loads(Path("output/visual_style_specimen_coverage.json").read_text())
          assert font_receipt["status"] == "PASS", font_receipt
          assert coverage["status"] == "PASS", coverage
          print("PASS: structural DOCX + font resolution + style coverage receipts")
          PY

      - name: Render preflight DOCX layout
        run: |
          libreoffice --headless --convert-to pdf --outdir render_pre output/ADR-001.docx
          test -s render_pre/ADR-001.pdf
          pdfinfo render_pre/ADR-001.pdf | head -20

      - name: Repair measured requirement page splits
        run: |
          python scripts/fix_requirement_page_splits.py \
            --docx output/ADR-001.docx \
            --pdf render_pre/ADR-001.pdf \
            --receipt output/ADR-001.pagination_pre.json

      - name: Refresh return receipt after pagination repair
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from src.bridges.data_rich_document_consumer import (
              build_return_receipt,
              load_manifest,
          )

          manifest = load_manifest(Path("projection/ADR-001.outward_document_manifest.json"))
          receipt = build_return_receipt(
              manifest,
              Path("projection/ADR-001.projection.md"),
              Path("config/reference.docx"),
              Path("output/ADR-001.docx"),
              style_config=Path("output/visual_style.resolved.json"),
          )
          Path("output/ADR-001.render_receipt.json").write_text(
              json.dumps(receipt, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print("PASS: refreshed post-layout render receipt")
          PY

      - name: Render final DOCX to PDF and PNG evidence
        run: |
          rm -rf render
          mkdir -p render
          libreoffice --headless --convert-to pdf --outdir render output/ADR-001.docx
          test -s render/ADR-001.pdf
          pdftoppm -png -r 144 render/ADR-001.pdf render/ADR-001-page
          test -n "$(find render -name 'ADR-001-page-*.png' -print -quit)"
          pdfinfo render/ADR-001.pdf | head -20

      - name: Assert final requirement pagination
        run: |
          python scripts/fix_requirement_page_splits.py \
            --docx output/ADR-001.docx \
            --pdf render/ADR-001.pdf \
            --receipt output/ADR-001.pagination_final.json \
            --check-only
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path("output/ADR-001.pagination_final.json").read_text())
          assert receipt["status"] == "PASS", receipt
          assert receipt["split_requirements"] == [], receipt
          print("PASS: final rendered requirement pagination")
          PY

      - name: Download approved visual baseline
        uses: actions/download-artifact@v4
        with:
          name: data-rich-docx-render-332bc99e26597ab8857f5cc38f5921c293d78334
          path: baseline
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: GBOGEB/DOCX_RTM_Automation
          run-id: 35375677112

      - name: Assert style-only semantic invariance
        run: |
          cmp baseline/projection/ADR-001.projection.md projection/ADR-001.projection.md
          python - <<'PY'
          import json
          from pathlib import Path

          base = json.loads(Path("baseline/projection/ADR-001.outward_document_manifest.json").read_text())
          cand = json.loads(Path("projection/ADR-001.outward_document_manifest.json").read_text())
          assert base["source"]["sha256"] == cand["source"]["sha256"]
          assert base["projection"]["sha256"] == cand["projection"]["sha256"]
          print("PASS: semantic source/projection invariant across style candidate")
          PY

      - name: Measure visual delta from approved baseline
        run: |
          python scripts/measure_visual_style_diff.py \
            --baseline-dir baseline/render \
            --candidate-dir render \
            --output output/ADR-001.visual_style_diff.json

      - name: Upload render receipt bundle
        uses: actions/upload-artifact@v4
        with:
          name: data-rich-docx-render-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            config/reference.docx
            projection/
            output/
            render/
            style_render/
            federation/DATA_RICH_DOCUMENT/visual_style.json
            federation/DATA_RICH_DOCUMENT/visual_style.schema.json
          if-no-files-found: error
