name: QPS W111 Power Utility Projection Bridge

on:
  pull_request:
    paths:
      - 'federation/POWER_UTILITY/**'
      - 'federation/ADR_OCD/bridge_manifest.yaml'
      - 'scripts/validate_qps_w111_power_utility_bridge.py'
      - '.github/workflows/qps-w111-power-utility-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  projection-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML
      - run: python scripts/validate_qps_w111_power_utility_bridge.py
