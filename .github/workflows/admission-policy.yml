name: Repository admission policy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admission-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository-side admission contract
        run: python scripts/validate_repository_admission_policy.py

      - name: Observe live main protection
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          repo = os.environ["REPOSITORY"]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/branches/main",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              payload = json.load(response)

          protected = bool(payload.get("protected"))
          print(f"main.protected={str(protected).lower()}")

          if not protected:
              print(
                  "::warning::P0-B owner gate remains open: main is not protected."
              )

          if (
              os.environ["EVENT_NAME"] == "push"
              and os.environ["REF_NAME"] == "main"
              and not protected
          ):
              print(
                  "::error::Fail closed: merged main must be protected before P0-B can close."
              )
              sys.exit(1)
          PY
