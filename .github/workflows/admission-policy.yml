name: Repository admission policy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  admission-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checked-out source identity
        run: |
          python - <<'PY'
          import os
          import subprocess

          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if actual != os.environ["SOURCE_SHA"]:
              raise SystemExit("SOURCE_SHA_MISMATCH")
          print(f"Verified checkout source: {actual}")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository-side admission contract
        run: python scripts/validate_repository_admission_policy.py

      - name: Test effective-policy readback and negative cases
        run: python tests/test_jade_h08_effective.py

      - name: Observe effective main policy (PR report-only; main fails closed)
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python scripts/jade_h08_effective.py --live \
            --output "$RUNNER_TEMP/admission-policy-readback.json"

      - name: Preserve effective-policy receipt even when blocked
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; same pin as pages.yml
        with:
          name: admission-policy-readback-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/admission-policy-readback.json
          if-no-files-found: error
