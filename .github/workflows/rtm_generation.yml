name: Generate RTM Reports

on:
  push:
    paths:
      - 'input/**'
      - 'docx_rtm_automation.py'
      - 'config.json'
  workflow_dispatch:
    inputs:
      regenerate_all:
        description: 'Force regeneration of all reports'
        required: false
        default: 'false'

jobs:
  generate_rtm:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install python-docx pandas openpyxl

    - name: Run RTM automation
      run: python docx_rtm_automation.py

    - name: Upload Excel report
      uses: actions/upload-artifact@v4
      with:
        name: rtm-excel
        path: output/rtm.xlsx

    - name: Upload Markdown reports
      uses: actions/upload-artifact@v4
      with:
        name: rtm-markdown
        path: |
          output/rtm.md
          output/coverage_report.md

    - name: Upload HTML report
      uses: actions/upload-artifact@v4
      with:
        name: rtm-html
        path: output/rtm_report.html

    - name: Commit and push if there are changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add output/
        git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update RTM reports"
        git push
