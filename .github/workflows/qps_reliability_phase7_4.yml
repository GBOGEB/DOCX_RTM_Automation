name: QPS Reliability Phase 7.4 Runtime Binding

on:
  pull_request:
    paths:
      - 'tests/fixtures/qps_reliability_phase7_4_input.json'
      - '.github/workflows/qps_reliability_phase7_4.yml'
      - 'scripts/run_qps_triage_pipeline.py'
      - 'scripts/verify_qps_triage_receipt.py'
      - 'scripts/create_qps_triage_ci_registry_receipt.py'
      - 'src/dashboard/qps_receipt_consumer.py'
      - 'scripts/build_qps_release_baseline.py'
  push:
    branches:
      - feature/qps-reliability-phase7-4-runtime-binding

jobs:
  governed-runtime-binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml pytest pandas python-docx
      - name: Run reliability input through Wave 8
        env:
          QPS_EVIDENCE_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          rm -rf .artifacts/qps-rel-wave8 .artifacts/qps-rel-wave9 .artifacts/qps-rel-wave10 .artifacts/qps-rel-wave11
          python scripts/run_qps_triage_pipeline.py --input-analysis tests/fixtures/qps_reliability_phase7_4_input.json --output-dir .artifacts/qps-rel-wave8
          python scripts/verify_qps_triage_receipt.py .artifacts/qps-rel-wave8
      - name: Upload governed reliability evidence
        id: rel_bundle
        uses: actions/upload-artifact@v4
        with:
          name: qps-reliability-wave8-${{ github.event.pull_request.head.sha || github.sha }}
          path: .artifacts/qps-rel-wave8/
          if-no-files-found: error
          retention-days: 14
      - name: Bind external artifact receipt
        run: |
          mkdir -p .artifacts/qps-rel-wave9
          python scripts/create_qps_triage_ci_registry_receipt.py .artifacts/qps-rel-wave8 --artifact-id '${{ steps.rel_bundle.outputs.artifact-id }}' --artifact-url '${{ steps.rel_bundle.outputs.artifact-url }}' --artifact-digest '${{ steps.rel_bundle.outputs.artifact-digest }}' --artifact-name 'qps-reliability-wave8-${{ github.event.pull_request.head.sha || github.sha }}' --output .artifacts/qps-rel-wave9/qps_triage_ci_registry_receipt.json
      - name: Consume receipt - Wave 10 ACCEPT gate
        run: |
          mkdir -p .artifacts/qps-rel-wave10
          python src/dashboard/qps_receipt_consumer.py .artifacts/qps-rel-wave9/qps_triage_ci_registry_receipt.json --expected-git-sha '${{ github.event.pull_request.head.sha || github.sha }}' --output .artifacts/qps-rel-wave10/qps_release_baseline_evidence.json --require-accept
      - name: Exercise Wave 11 promotion gate
        run: |
          mkdir -p .artifacts/qps-rel-wave11
          python scripts/build_qps_release_baseline.py --evidence .artifacts/qps-rel-wave10/qps_release_baseline_evidence.json --stage final_corrigendum --expected-git-sha '${{ github.event.pull_request.head.sha || github.sha }}' --output .artifacts/qps-rel-wave11/qps_release_baseline_manifest.json --require-promote
      - name: Upload decision chain
        uses: actions/upload-artifact@v4
        with:
          name: qps-reliability-decisions-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .artifacts/qps-rel-wave9/
            .artifacts/qps-rel-wave10/
            .artifacts/qps-rel-wave11/
          if-no-files-found: error
          retention-days: 14
