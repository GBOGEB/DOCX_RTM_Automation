name: RTM reconciliation contract

on:
  pull_request:
    paths:
      - 'scripts/reconcile_source_to_canonical_rtm.py'
      - 'tests/test_rtm_reconciliation.py'
      - '.github/workflows/rtm-reconciliation-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reconciliation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Run focused reconciliation contract without unrelated repo coverage addopts
        run: python -m pytest -o addopts='' tests/test_rtm_reconciliation.py -q
