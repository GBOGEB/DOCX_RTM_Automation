name: JADE noncompensating admission and release guard
on:
  pull_request:
    paths:
      - ".github/workflows/admission-policy.yml"
      - ".github/workflows/release-identity.yml"
      - ".github/workflows/jade-release-guard.yml"
      - "release/RELEASE_IDENTITY.json"
      - "tests/test_jade_admission_release_contract.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/admission-policy.yml"
      - ".github/workflows/release-identity.yml"
      - ".github/workflows/jade-release-guard.yml"
      - "release/RELEASE_IDENTITY.json"
      - "tests/test_jade_admission_release_contract.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p 'test_jade_admission_release_contract.py' -v
      - run: python scripts/validate_release_identity.py
