name: H04 lock bootstrap (temporary)

# Temporary: generates the initial lock files on a clean runner and commits
# them to this branch. Removed again before review.
on:
  push:
    branches: [ci/h04-dependency-lock-20261027]

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ !contains(github.event.head_commit.message, '[lock-bootstrap-output]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate locks
        shell: bash
        run: |
          set -uo pipefail
          run() {
            local label="$1"; shift
            if ! "$@" > "$RUNNER_TEMP/out.log" 2>&1; then
              msg=$(tail -c 3500 "$RUNNER_TEMP/out.log" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              echo "::error title=${label}::${msg}"
              exit 1
            fi
          }
          run uv-install python -m pip install uv==0.9.0
          run uv-compile uv pip compile requirements/requirements.txt --universal --python-version 3.12 \
            --generate-hashes --no-header -o requirements/requirements.lock
          cd orchestration_ts
          run npm-lock npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements/requirements.lock orchestration_ts/package-lock.json
          git commit -m "build(deps): generate lock files on clean runner [lock-bootstrap-output]"
          run git-push git push
