name: W101 Source-only Recursive Recovery
on:
  pull_request:
    paths:
      - 'scripts/w101_source_feature_workers.py'
      - '.github/workflows/w101-source-only-recursive-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-worker:
    strategy:
      fail-fast: false
      matrix:
        lane: [clause, text, family]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build immutable source extraction
        run: |
          python -m pip install python-docx
          python scripts/parse_document_current.py addenda/Addendum_II_Cryoplant_Technical_Requirements.docx --output out/source.json
      - name: Build deterministic source feature receipt twice
        run: |
          python scripts/w101_source_feature_workers.py --extraction out/source.json --lane ${{ matrix.lane }} --output out/${{ matrix.lane }}-1.json
          sleep 1
          python scripts/w101_source_feature_workers.py --extraction out/source.json --lane ${{ matrix.lane }} --output out/${{ matrix.lane }}-2.json
          python - <<'PY'
          import json, os
          lane=os.environ['LANE']
          a=json.load(open(f'out/{lane}-1.json')); b=json.load(open(f'out/{lane}-2.json'))
          assert a['semantic_digest']==b['semantic_digest']
          assert a['observed_at']!=b['observed_at']
          assert a['semantic']['source_atoms']==757
          print('PASS idempotent', lane, a['semantic_digest'])
          PY
        env:
          LANE: ${{ matrix.lane }}
      - uses: actions/upload-artifact@v4
        with:
          name: w101-${{ matrix.lane }}
          path: out/${{ matrix.lane }}-1.json
          if-no-files-found: error
  serialize:
    needs: source-worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: w101-*
          path: out
          merge-multiple: true
      - name: Serialize lineage and backlog handoff
        run: |
          python - <<'PY'
          import glob,json,hashlib,pathlib,datetime
          docs=[json.load(open(p)) for p in sorted(glob.glob('out/*.json'))]
          assert {d['semantic']['lane'] for d in docs}=={'clause','text','family'}
          assert len({d['semantic']['source_extraction_sha256'] for d in docs})==1
          stable={'schema':'w101-serialized-source-handoff/v1','parent_failed_head':'7aec5919ec5dcd693fb7c653ae467f47c302319a','source_atoms':757,'prior_exact_text':28,'prior_source_unmatched':729,'prior_canonical_unmatched':694,'worker_digests':{d['semantic']['lane']:d['semantic_digest'] for d in docs},'next_owner':'GBOGEB/cryoplant-project','next_operation':'join only prior 729 source-unmatched against governed 722 canonical structure','authority_effect':'NONE','compliance_credit':False,'release_credit':False}
          stable['semantic_digest']=hashlib.sha256(json.dumps(stable,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          stable['observed_at']=datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z')
          pathlib.Path('W101_SERIALIZED_SOURCE_HANDOFF.json').write_text(json.dumps(stable,indent=2,sort_keys=True)+'\n')
          print(json.dumps(stable,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: w101-serialized-source-handoff
          path: W101_SERIALIZED_SOURCE_HANDOFF.json
