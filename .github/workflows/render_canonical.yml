name: Render Canonical Artefacts

# Triggers whenever canonical artefact JSON files are pushed.
# Generates canonical/REPORT.md and docs/CANONICAL_SSOT.md,
# then commits them back to the branch.

on:
  push:
    paths:
      - "canonical/artefacts/**"
      - "canonical/LOCK.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    name: Render canonical artefacts report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Must match the interpreter requirements/requirements.lock was compiled for.
          python-version: "3.12"

      - name: Install dependencies (hash-verified, from the lock; no fallback)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements/requirements.lock

      - name: Generate canonical report
        run: python scripts/render_canonical_report.py

      - name: Commit rendered report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          test -f canonical/REPORT.md
          test -f docs/CANONICAL_SSOT.md
          git add canonical/REPORT.md docs/CANONICAL_SSOT.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: auto-render canonical artefacts report [skip ci]"
            git push
          fi
