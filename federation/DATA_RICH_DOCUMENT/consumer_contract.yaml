producer:
  repo: GBOGEB/document-organization-system
  merged_adapter_sha: e181903236e70b7b798b56fd59fc8948cd9885c0
  manifest_schema: gbogeb.docx-rtm-outward-document-manifest/1.0.0

consumer:
  repo: GBOGEB/DOCX_RTM_Automation
  role: TOOLING_TRANSFORM_ONLY
  entrypoint: src/bridges/data_rich_document_consumer.py
  reference_builder: scripts/build_data_rich_reference_docx.py

heading_contract:
  levels:
    1: Heading 1
    2: Heading 2
    3: Heading 3
  display_numbering_owner: REFERENCE_DOCX_MULTILEVEL_LIST
  heading_text_numbering: FORBIDDEN
  forbidden_filter: config/filters/extend_headings.lua

visual_style_contract:
  schema: docx_rtm.visual_style/1.0.0
  path: federation/DATA_RICH_DOCUMENT/visual_style.json
  schema_path: federation/DATA_RICH_DOCUMENT/visual_style.schema.json
  current_style_id: QPS_TECH_GRAPHITE_TEAL_COPPER_V1
  owner: DOCX_RENDER_LAYER_ONLY
  semantic_change_allowed: false
  accepted_baseline_mutation_allowed: false
  user_font_mode: NAME_REFERENCE_TO_USER_OR_SYSTEM_INSTALLED_FONT
  embed_font_files: false
  roles:
    - body_font
    - heading_font
    - mono_font
    - title_h1_h2_h3_body_caption_requirement_metadata_sizes
    - body_heading_special_number_requirement_caption_metadata_colors
    - heading_number_accent
    - requirement_id_accent
    - caption_number_accent
    - tables_callouts_spacing

approved_visual_baseline:
  status: USER_APPROVED
  docx_sha256: e936ffcb89eb7da13b8be8d447c8453b5b4499a4907390816846f5c8ec94a6b9
  pdf_sha256: 654e74630861b5b398ab577d55da5f692bf4549b0af480498822428109353b02
  artifact_digest: sha256:ce9c806aebcce0cc9f15eaaf728c4e2bb30e4e93cb2db26b80c9e8c3ce8db8f0
  workflow_run: 35375677112
  immutable_regression_reference: true

source_binding:
  require_exact_git_ref: true
  require_source_json_sha256: true
  require_projection_markdown_sha256: true
  semantic_authority: UPSTREAM_JSON_ONLY

return_receipt:
  required:
    - source_json_sha256
    - projection_markdown_sha256
    - source_git_ref
    - reference_doc_sha256
    - rendered_docx_sha256
    - render_status
    - heading_style_check
    - template_numbering_check
    - duplicate_numbering_check
    - requirement_pagination_check
    - visual_style_id
    - visual_style_sha256
    - visual_style_check
  acceptance:
    render_status: PASS
    heading_style_check: PASS
    template_numbering_check: PASS
    duplicate_numbering_check: PASS
    requirement_pagination_check: PASS
    visual_style_check: PASS

pagination_contract:
  structural_hint: KEEP_WITH_NEXT_HINTS
  measured_layout_feedback:
    preflight_pdf_required: true
    split_detection: REQUIREMENT_PARAGRAPHS_MUST_SHARE_TITLE_PAGE
    repair: PAGE_BREAK_BEFORE_SPLIT_REQUIREMENT
    rerender_required: true
    final_split_check: REQUIRED
  visual_regression_target: NO_ORPHANED_REQUIREMENT_METADATA

visual_gate:
  binary_render_to_pdf_png: REQUIRED_FOR_CI_EVIDENCE
  approved_baseline_visual_diff: REQUIRED_FOR_STYLE_CANDIDATE
  semantic_projection_invariance: REQUIRED_FOR_STYLE_CANDIDATE
  human_visual_approval: REQUIRED_TO_REPLACE_ACCEPTED_BASELINE
  consumer_may_self_approve_visuals: false

writeback:
  direct_docx_to_json_override: false
  semantic_change_transport: JSON_CHANGE_SET
  upstream_approval_required: true

controls:
  authority_transfer: false
  engineering_credit: false
  compliance_credit: false
  procurement_acceptance_credit: false
