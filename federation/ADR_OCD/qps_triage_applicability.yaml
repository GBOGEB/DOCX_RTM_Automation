applicability_id: ADR_OCD_QPS_TRIAGE_APPLICABILITY
version: 0.1.0
status: draft
purpose: >
  Make the ADR_OCD federation bridge directly usable for QPS Requirements and
  triage workflows by defining shared statuses, lanes, evidence classes, and
  progression gates.

scope:
  applies_to:
    - QPS Requirements
    - Architecture Design Report
    - Operational Concept Document
    - Requirements Traceability Matrix
    - Deliverables Traceability Matrix
    - Corrigendum
    - Triage
  repositories:
    primary:
      - GBOGEB/DOCX_RTM_Automation
    federation_candidates:
      - GBOGEB/CODEX
      - GBOGEB/ABACUS
      - GBOGEB/cryoplant-project

terminology_policy:
  preferred_outward_facing: QPS Requirements
  legacy_internal_alias: RFO
  triage_name: Triage
  rule: >
    Use QPS Requirements for procurement-facing content. Use Triage for
    classification, disposition, prioritization, repair waves, and evidence
    maturity management. Keep RFO only as a legacy/internal alias.

triage_lanes:
  - lane_id: TRIAGE-QPS
    name: QPS Requirements lane
    purpose: Classify source requirements, tender changes, and applicant-facing obligations.
    accepted_inputs:
      - qps_requirement
      - corrigendum_entry
      - negotiation_action
      - applicant_question
      - requirement_change
    outputs:
      - qps_disposition
      - rtm_update
      - corrigendum_impact

  - lane_id: TRIAGE-ADR
    name: ADR design-decision lane
    purpose: Classify architecture impact, decision rationale, and design-risk propagation.
    accepted_inputs:
      - adr_decision
      - interface_decision
      - control_decision
      - reliability_decision
      - material_decision
    outputs:
      - adr_disposition
      - decision_register_update
      - design_impact

  - lane_id: TRIAGE-OCD
    name: OCD operational-impact lane
    purpose: Classify operational scenarios, workflows, degraded modes, training, and evidence impacts.
    accepted_inputs:
      - ocd_scenario
      - ocd_workflow
      - operational_constraint
      - training_need
      - maintenance_need
    outputs:
      - ocd_disposition
      - otc_update
      - operational_impact

  - lane_id: TRIAGE-RTM-DTM
    name: RTM DTM traceability lane
    purpose: Classify missing, stale, weak, or conflicting traceability edges.
    accepted_inputs:
      - rtm_row
      - dtm_row
      - lineage_edge
      - evidence_gap
    outputs:
      - traceability_update
      - evidence_request
      - maturity_delta

triage_dispositions:
  - disposition: ACCEPT
    meaning: Source-supported, structurally valid, and ready for controlled reuse.
  - disposition: DEFER
    meaning: Structurally captured but missing authoritative evidence or implementation binding.
  - disposition: REJECT
    meaning: Conflicting, obsolete, unsupported, or not applicable to the controlled baseline.
  - disposition: NEEDS_SOURCE
    meaning: Requires source, page, file, SHA, receipt, or evidence locator before promotion.
  - disposition: NEEDS_IMPLEMENTATION
    meaning: Governance item exists but code, parser, render, export, or CI implementation is not wired.
  - disposition: NEEDS_REVIEW
    meaning: Requires human engineering, procurement, legal, or contract review.

maturity_levels:
  - level: 0.0
    name: captured
    gate: Item exists in glossary, manifest, taxonomy, or raw extraction.
  - level: 0.3
    name: structured
    gate: Item has type, owner lane, identifiers, and required fields.
  - level: 0.6
    name: validated
    gate: Item passes schema and validator checks.
  - level: 0.8
    name: traceable
    gate: Item is linked to QPS, ADR, OCD, RTM, DTM, or Corrigendum edge.
  - level: 1.0
    name: controlled
    gate: Item is source-supported, tested, CI-visible, and ready for merge or release.

priority_scoring:
  fields:
    - field: evidence_gap
      weight: 3
    - field: downstream_impact
      weight: 3
    - field: procurement_visibility
      weight: 2
    - field: implementation_effort
      weight: 1
    - field: safety_or_contract_risk
      weight: 4
  rule: >
    Higher scores move first unless a lower-effort item can be completed immediately
    without blocking higher-risk work.

qps_to_triage_edges:
  - from: QPS Requirement
    to: Triage Item
    relation: classified_as
  - from: Triage Item
    to: ADR Design Decision
    relation: design_impact_to
  - from: Triage Item
    to: OCD Operational Scenario
    relation: operational_impact_to
  - from: Triage Item
    to: RTM Row
    relation: traceability_impact_to
  - from: Triage Item
    to: DTM Row
    relation: deliverable_impact_to
  - from: Triage Item
    to: Corrigendum Entry
    relation: amendment_impact_to

control_gates:
  - gate_id: QPS-TRIAGE-GATE-001
    name: term_reuse
    rule: Every outward-facing term resolves to glossary/GLOSSARY.yaml.
  - gate_id: QPS-TRIAGE-GATE-002
    name: lane_assignment
    rule: Every triage item has exactly one primary lane and may have secondary lanes.
  - gate_id: QPS-TRIAGE-GATE-003
    name: disposition_assignment
    rule: Every triage item has one controlled disposition.
  - gate_id: QPS-TRIAGE-GATE-004
    name: maturity_assignment
    rule: Every triage item has a maturity level from 0.0 to 1.0.
  - gate_id: QPS-TRIAGE-GATE-005
    name: downstream_impact
    rule: Items affecting QPS Requirements identify ADR, OCD, RTM, DTM, or Corrigendum impact where applicable.
