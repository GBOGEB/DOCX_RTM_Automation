config_id: QPS_TRIAGE_PARSER_CONFIG
version: 0.7.0
status: draft
purpose: >
  Wire ADR_OCD/QPS triage through parser enrichment, persisted exports,
  dashboard/report generation, exact-SHA evidence governance, external CI
  artifact registry binding, and downstream release/baseline consumption.

qps_triage:
  enabled: true
  taxonomy_path: federation/ADR_OCD/taxonomy.yaml
  applicability_path: federation/ADR_OCD/qps_triage_applicability.yaml
  fail_on_error: true

inputs:
  taxonomy: federation/ADR_OCD/taxonomy.yaml
  applicability: federation/ADR_OCD/qps_triage_applicability.yaml
  enhanced_parser_keys:
    rtm: enhanced_rtm_elements
    otc: enhanced_otc_elements
    dtm: enhanced_del_elements

outputs:
  triage_items_key: qps_triage_items
  traceability_rows_key: qps_triage_traceability_rows
  json_export_name: qps_triage_enriched_analysis.json
  traceability_csv_name: qps_triage_traceability_rows.csv
  engine_export_files:
    - enhanced_analysis.json
    - enhanced_rtm_elements.json
    - enhanced_otc_elements.json
    - enhanced_del_elements.json
    - relationship_mapping.json
    - recursive_mapping.json
    - parsing_statistics.json
    - qps_triage_items.json
    - qps_triage_traceability_rows.json
    - qps_triage_traceability_rows.csv
    - qps_triage_downstream_index.json
    - qps_triage_rtm_rows.csv
    - qps_triage_dtm_rows.csv
    - export_manifest.json
  dashboard_files:
    - qps_triage_dashboard.json
    - qps_triage_dashboard.md
    - qps_triage_dashboard.html
    - canonical_dashboard.json
    - qps_triage_pipeline_manifest.json
  governance_files:
    - qps_triage_evidence_manifest.json
    - qps_triage_governed_receipt.json
    - SHA256SUMS
    - qps_triage_ci_registry_receipt.json
    - qps_release_baseline_evidence.json

waves:
  wave_2a: {name: parser_configuration_wiring, status: implemented_by_parser_qps_triage_bridge}
  wave_2b: {name: triage_item_emission, status: implemented_by_QPSTriageBridge.emit_triage_items}
  wave_3: {name: traceability_export_rows, status: implemented_by_QPSTriageBridge.export_traceability_rows}
  wave_4a: {name: optional_engine_integration, status: implemented_by_EnhancedParserEngine_parse_document_flag}
  wave_4b: {name: export_persistence_and_downstream_index, status: implemented_by_EnhancedParserEngine_export_enhanced_analysis}
  wave_5: {name: downstream_report_generation, status: implemented_by_QPSTriageDashboardGenerator}
  wave_6: {name: canonical_dashboard_link, status: implemented_by_canonical_dashboard_collect_stats}
  wave_7: {name: one_command_pipeline_and_ci_archive, status: superseded_by_wave_8_governed_pipeline}
  wave_8:
    name: exact_sha_evidence_governance
    status: implemented_and_runtime_verified
    hash_algorithm: SHA256
    parity_rule: >
      Every regular pipeline payload artifact appears exactly once in the
      evidence manifest with matching path, byte size and SHA256; the governed
      receipt binds the pipeline/evidence manifests and SHA256SUMS covers the bundle.
    ci_artifact: qps-triage-wave8-${exact_head_sha}
    retention_days: 14
  wave_9:
    name: external_ci_artifact_registry_receipt
    status: implemented_and_runtime_verified
    producer: scripts/create_qps_triage_ci_registry_receipt.py
    source_artifact: qps-triage-wave8-${exact_head_sha}
    binds:
      - artifact_id
      - artifact_name
      - artifact_url
      - artifact_digest
      - exact_head_sha
      - workflow_run_id
      - qps_triage_governed_receipt_sha256
      - SHA256SUMS_sha256
    registry_artifact: qps-triage-wave9-registry-${exact_head_sha}
  wave_10:
    name: registry_receipt_consumption
    status: implemented_pending_runtime_verification
    consumer: src/dashboard/qps_receipt_consumer.py
    dashboard: src/dashboard/canonical_dashboard.py
    decision_output: qps_release_baseline_evidence.json
    decision_rule:
      ACCEPT: >
        Registry receipt exists, status is PASS, observed Git SHA equals the
        explicitly expected 40-character Git SHA, external artifact binding is
        present, and provider SHA256 is valid.
      DEFER: >
        Receipt is absent, invalid, non-PASS, stale/mismatched, lacks the exact
        expected SHA, lacks external artifact binding, or lacks a valid provider digest.
    ci_command: >
      python src/dashboard/qps_receipt_consumer.py
      .artifacts/qps-triage-wave9/qps_triage_ci_registry_receipt.json
      --expected-git-sha ${exact_head_sha}
      --output .artifacts/qps-triage-wave10/qps_release_baseline_evidence.json
      --require-accept
    ci_artifact: qps-triage-wave10-consumption-${exact_head_sha}
    retention_days: 14
