config_id: QPS_TRIAGE_PARSER_CONFIG
version: 0.2.0
status: draft
purpose: >
  Wire the ADR_OCD taxonomy and QPS triage applicability model into parser-side
  enrichment and optionally enable direct EnhancedParserEngine integration.

qps_triage:
  enabled: true
  taxonomy_path: federation/ADR_OCD/taxonomy.yaml
  applicability_path: federation/ADR_OCD/qps_triage_applicability.yaml
  fail_on_error: true

inputs:
  taxonomy: federation/ADR_OCD/taxonomy.yaml
  applicability: federation/ADR_OCD/qps_triage_applicability.yaml
  enhanced_parser_keys:
    rtm: enhanced_rtm_elements
    otc: enhanced_otc_elements
    dtm: enhanced_del_elements

outputs:
  triage_items_key: qps_triage_items
  traceability_rows_key: qps_triage_traceability_rows
  json_export_name: qps_triage_enriched_analysis.json
  traceability_csv_name: qps_triage_traceability_rows.csv

waves:
  wave_2a:
    name: parser_configuration_wiring
    status: implemented_by_parser_qps_triage_bridge
    checks:
      - taxonomy_yaml_loads
      - applicability_yaml_loads
      - parser_config_declares_input_keys
  wave_2b:
    name: triage_item_emission
    status: implemented_by_QPSTriageBridge.emit_triage_items
    emits:
      - triage_id
      - source_id
      - source_type
      - primary_lane
      - disposition
      - maturity_level
      - priority_score
  wave_3:
    name: traceability_export_rows
    status: implemented_by_QPSTriageBridge.export_traceability_rows
    emits:
      - row_id
      - triage_id
      - from_object
      - relation
      - to_object
      - disposition
      - maturity_level
      - evidence_class
  wave_4a:
    name: optional_engine_integration
    status: implemented_by_EnhancedParserEngine_parse_document_flag
    rule: >
      EnhancedParserEngine.parse_document() calls QPSTriageBridge.enrich_analysis()
      only when qps_triage.enabled is true. The default parser config keeps the
      bridge disabled for backward compatibility.
    emits:
      - qps_triage_items
      - qps_triage_traceability_rows
      - parsing_metadata.qps_triage_bridge
