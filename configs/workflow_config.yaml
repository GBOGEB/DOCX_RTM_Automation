
# Enhanced Workflow Configuration
# Comprehensive automation pipeline settings

workflow:
  name: "Enhanced DOCX RTM Automation"
  version: "2.0.0"
  description: "Full lifecycle document management with DMAIC compliance"

document_processing:
  input_formats:
    - "docx"
    - "doc" 
    - "pdf"
    - "txt"
  
  output_formats:
    - "json"
    - "csv"
    - "markdown"
    - "html"
    - "pdf"
  
  parsing_options:
    rtm_extraction: true
    otc_extraction: true
    del_extraction: true
    table_processing: true
    image_extraction: false
    
  quality_thresholds:
    minimum_confidence: 0.6
    rtm_pattern_match: 0.7
    content_completeness: 0.8

visualization:
  enabled: true
  output_formats:
    - "html"
    - "png"
    - "svg"
    - "pdf"
  
  dashboard_types:
    - "executive_summary"
    - "requirements_analysis"
    - "compliance_tracking"
    - "section_explorer"
  
  chart_settings:
    color_palette: "professional"
    interactive: true
    responsive: true
    export_enabled: true

dmaic_pipeline:
  enabled: true
  auto_phase_transition: true
  compliance_monitoring: true
  
  phases:
    define:
      duration_days: 14
      required_deliverables:
        - "Problem Statement"
        - "Project Charter"
        - "SIPOC Diagram"
        - "Stakeholder Analysis"
      success_criteria:
        - "Clear problem definition"
        - "Stakeholder alignment"
        - "Scope definition"
        - "Success metrics defined"
    
    measure:
      duration_days: 21
      required_deliverables:
        - "Data Collection Plan"
        - "Baseline Measurements"
        - "Measurement System Analysis"
        - "Process Map"
      success_criteria:
        - "Reliable data collection"
        - "Baseline established"
        - "Measurement system validated"
        - "Process documented"
    
    analyze:
      duration_days: 28
      required_deliverables:
        - "Root Cause Analysis"
        - "Statistical Analysis"
        - "Hypothesis Testing"
        - "Gap Analysis"
      success_criteria:
        - "Root causes identified"
        - "Data-driven insights"
        - "Process understanding"
        - "Improvement opportunities"
    
    improve:
      duration_days: 35
      required_deliverables:
        - "Solution Design"
        - "Pilot Implementation"
        - "Results Analysis"
        - "Cost-Benefit Analysis"
      success_criteria:
        - "Solutions implemented"
        - "Improvements validated"
        - "Benefits realized"
        - "Risks mitigated"
    
    control:
      duration_days: 21
      required_deliverables:
        - "Control Plan"
        - "Standard Operating Procedures"
        - "Monitoring System"
        - "Training Materials"
      success_criteria:
        - "Sustained improvements"
        - "Process control"
        - "Knowledge transfer"
        - "Continuous monitoring"

compliance:
  frameworks:
    - "ISO 9001"
    - "CMMI"
    - "Six Sigma"
    - "PMBOK"
  
  thresholds:
    high_compliance: 0.9
    medium_compliance: 0.7
    low_compliance: 0.5
  
  monitoring:
    frequency: "daily"
    alerts_enabled: true
    reporting_interval: "weekly"
  
  metrics:
    - name: "Document Completeness"
      target: 0.95
      unit: "percentage"
    - name: "Requirements Traceability"
      target: 0.90
      unit: "percentage"
    - name: "Test Coverage"
      target: 0.85
      unit: "percentage"
    - name: "Deliverable Quality"
      target: 0.88
      unit: "score"

github_integration:
  enabled: true
  auto_pr_creation: true
  branch_protection: true
  
  workflows:
    - name: "document_processing"
      trigger: "push"
      branches: ["main", "develop"]
    - name: "compliance_check"
      trigger: "pull_request"
      branches: ["main"]
    - name: "visualization_update"
      trigger: "schedule"
      cron: "0 6 * * *"
  
  pr_settings:
    auto_merge: false
    require_reviews: 2
    dismiss_stale_reviews: true
    require_status_checks: true

notifications:
  enabled: true
  channels:
    - "email"
    - "slack"
    - "webhook"
  
  events:
    - "processing_complete"
    - "compliance_violation"
    - "dmaic_phase_complete"
    - "error_occurred"
  
  templates:
    processing_complete:
      subject: "Document Processing Complete - {{project_name}}"
      body: "Processing job {{job_id}} has completed successfully."
    
    compliance_violation:
      subject: "Compliance Alert - {{metric_name}}"
      body: "Compliance metric {{metric_name}} is below threshold."

security:
  authentication:
    enabled: true
    method: "jwt"
    token_expiry: "24h"
  
  authorization:
    rbac_enabled: true
    roles:
      - "admin"
      - "manager"
      - "analyst"
      - "viewer"
  
  data_protection:
    encryption_at_rest: true
    encryption_in_transit: true
    data_retention_days: 365
    
  audit:
    enabled: true
    log_level: "info"
    retention_days: 90

performance:
  processing:
    max_concurrent_jobs: 5
    timeout_minutes: 30
    retry_attempts: 3
  
  caching:
    enabled: true
    ttl_minutes: 60
    max_size_mb: 500
  
  monitoring:
    metrics_enabled: true
    health_check_interval: 30
    performance_alerts: true

integration:
  external_systems:
    jira:
      enabled: false
      webhook_url: ""
      auth_token: ""
    
    confluence:
      enabled: false
      base_url: ""
      auth_token: ""
    
    slack:
      enabled: false
      webhook_url: ""
      channel: "#automation"
  
  apis:
    rate_limiting:
      requests_per_minute: 100
      burst_limit: 20
    
    versioning:
      strategy: "header"
      current_version: "v2"
      supported_versions: ["v1", "v2"]

logging:
  level: "info"
  format: "json"
  
  outputs:
    - type: "file"
      path: "logs/application.log"
      rotation: "daily"
      retention_days: 30
    
    - type: "console"
      format: "simple"
      level: "info"
  
  structured_logging: true
  correlation_id: true
  performance_logging: true
