profile_id: QPS_OFFER_EVALUATION_V7_1
version: 7.1
status: controlled_projection_candidate
purpose: >
  Bind the OFFER-01..OFFER-50 deterministic static evaluation method into QPS
  Triage as a procurement-facing prioritisation and evidence-review profile
  without promoting evaluation outputs into QPS engineering truth.

authority_boundary:
  qps_engineering_authority: GBOGEB/cryoplant-project
  qps_tooling_repo: GBOGEB/DOCX_RTM_Automation
  evaluation_role: PROCUREMENT_EVALUATION_METHOD
  engineering_promotion_forbidden: true
  seeded_bidder_values_are_engineering_evidence: false
  seeded_bidder_values_evidence_class: POSTULATED
  exact_binary_hash_binding: DEFER
  exact_binary_hash_reason: >
    Chat-produced v7.1 Word/Excel/PPT artifacts are not yet repository-bound by
    exact SHA256 in this PR. Their filenames/version are method references only
    until a governed artifact receipt is attached.

method_lock:
  static_requirement_ranking_first: true
  bidder_scoring_second: true
  risk_overlay_third: true
  deterministic: true
  stochastic_production_seed: false
  schedule_policy: gate_only
  cost_activation: only_if_technical_near_tie
  precedence:
    - legal_gate
    - functional_non_negotiable
    - reliability_2K_continuity
    - performance_heat_load_match
    - verifiability_QA_FAT_SAT
    - lifecycle_maintainability
    - cost

core_equations:
  base_score: "Score_i = W_i * E_i * G_i"
  pairwise_bidder: "BT(A,B) = sum_i(w_i * S_i(A,B))"
  total_risk: "R_i = BaseRisk_i + BidderRisk_i + SystemRisk_i"
  adjusted_score: "Adjusted_i = Score_i * (1 - R_i)"
  interpretation:
    ranking: requirement_importance
    risk: delivery_confidence

