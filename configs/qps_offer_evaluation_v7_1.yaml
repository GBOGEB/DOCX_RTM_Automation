triage_projection:
  primary_lane: TRIAGE-QPS
  secondary_lanes:
    reliability: [TRIAGE-RTM-DTM, TRIAGE-OCD]
    controls: [TRIAGE-ADR, TRIAGE-OCD, TRIAGE-RTM-DTM]
    verification_quality: [TRIAGE-RTM-DTM]
  default_disposition_before_bidder_source_binding: NEEDS_SOURCE
  default_maturity_before_bidder_source_binding: 0.3
  rules:
    - >
      Static rank may influence triage priority but may not be used as QPS
      engineering acceptance or compliance credit.
    - >
      Seeded bidder A/B values remain POSTULATED until replaced by exact-source
      bidder evidence and a governed source identity.
    - >
      Risk is independent of static rank; risk may change bidder comparison but
      must not rewrite the requirement-importance hierarchy.
    - >
      Gate failure overrides score. Cost cannot rescue a legal, functional, or
      dominant technical failure.
    - >
      OFFER evaluation tiers are procurement-evaluation metadata. They do not
      replace QPS Triage disposition, maturity, or child engineering authority.

